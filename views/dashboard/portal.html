<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>久留美 · 交易复盘</title>
  <link rel="stylesheet" href="/assets/portal.css">
  <link rel="stylesheet" href="/assets/replay.css">
  <script src="/assets/lightweight-charts.js" defer></script>
  <script src="/assets/portal.js" type="module"></script>
</head>
<body>
  <div class="portal-shell">
    <aside id="portal-sidebar" class="portal-sidebar" hidden>
      <div class="portal-brand"><img src="/assets/avatar.png" alt=""><div><strong>久留美</strong><small>模拟器</small></div></div>
      <nav aria-label="用户面板">
        <button type="button" data-portal-page="review" aria-pressed="true">AI 复盘</button>
        <button type="button" data-portal-page="trading" aria-pressed="false">交易工作台</button>
        <button type="button" data-portal-page="journal" aria-pressed="false">交易日志</button>
        <button type="button" data-portal-page="notebook" aria-pressed="false">计划与经验</button>
      </nav>
      <p>真实行情<br>虚拟资金</p>
    </aside>
  <main class="portal">
    <header class="portal-header">
      <div><span>久留美模拟器</span><h1 id="portal-title">她的交易记录</h1></div>
      <div class="portal-header-actions">
        <label id="portal-tabs" hidden>交易实例 <select id="portal-instance"></select></label>
        <button id="portal-logout" type="button" hidden>退出面板</button>
      </div>
    </header>
    <p id="portal-status" role="status"></p>
    <section id="portal-welcome" class="portal-card">
      <div class="portal-welcome-art" aria-hidden="true"></div>
      <div class="portal-welcome-content">
      <h2 id="portal-welcome-title">打开你的复盘</h2>
      <p id="portal-welcome-copy">在机器人私聊里领取账号和首次密码，或直接领取只读面板入口。</p>
      <form id="portal-login" method="post" action="/api/login">
        <label>账号（私聊 UMO） <input name="username" autocomplete="username" required maxlength="300"></label>
        <label>密码 <input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
        <button type="submit">登录模拟交易面板</button>
      </form>
      <button id="portal-exchange" type="button" hidden>打开只读面板</button>
      </div>
    </section>
    <section id="portal-banner" class="portal-banner" hidden>
      <p>久留美的外汇日记</p>
      <h2>每一笔，都有她的理由。</h2>
      <p>行情不总是顺心，每一次经历都值得复盘。</p>
      <small>真实行情 / 虚拟资金 / 自己摸索</small>
    </section>
    <section id="portal-review" class="public-replay" hidden></section>
    <section id="portal-trading" hidden></section>
    <section id="portal-records" class="portal-records" hidden></section>
  </main>
  </div>
</body>
</html>
